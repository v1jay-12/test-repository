<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Commit</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); }
    .card { background: #fff; border: 1px solid #e1e6ef; border-radius: 16px; padding: clamp(24px, 6vw, 48px); box-shadow: 0 12px 36px #1e355012; }
    .eyebrow { color: #5868d8; font-size: .8rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; }
    p { color: #5d6678; line-height: 1.65; }
    .commit { display: flex; align-items: center; gap: 12px; margin-top: 28px; padding: 14px 16px; background: #f5f6ff; border-radius: 10px; }
    .dot { width: 10px; height: 10px; flex: 0 0 auto; background: #5868d8; border-radius: 50%; }
    code { color: #303c9a; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow">Repository milestone</div>
      <h1 id="title">The first commit.</h1>
      <p>Every project starts somewhere. This page marks the beginning of the repository—its first commit and the foundation for everything that follows.</p>
      <div class="commit"><span class="dot" aria-hidden="true"></span><code>Initial commit</code></div>
    </section>
  </main>
</body>
</html>
