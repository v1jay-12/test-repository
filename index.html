<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Commit</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgb(255 46 166 / 42%), transparent 32%),
        radial-gradient(circle at 85% 78%, rgb(0 229 255 / 36%), transparent 36%),
        linear-gradient(135deg, #190b38, #3b1b82 52%, #06566b);
    }

    h1 {
      margin: 0;
      padding: 2rem 3rem;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: 1rem;
      background: rgb(255 255 255 / 10%);
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%);
      font-size: clamp(2rem, 8vw, 4rem);
      letter-spacing: 0.04em;
      text-align: center;
      backdrop-filter: blur(12px);
      border-color: rgb(255 255 255 / 50%);
      background: linear-gradient(135deg, rgb(255 46 166 / 30%), rgb(0 229 255 / 22%));
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 30%), 0 0 2.5rem rgb(255 46 166 / 38%);
      text-shadow: 0 0 1.25rem rgb(0 229 255 / 80%);
      animation: vibrant-float 4s ease-in-out infinite alternate;
    }

    @keyframes vibrant-float {
      to { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Third Commit</h1>
</body>
</html>
